# Checks every push to develop and main, and every pull request: the build and tests on Windows, Linux and macOS (the
# analyzers and code style fail the build), and the page's JavaScript (lint, type check, tests, magic values, copies,
# import cycles).
# Read-only: no secrets, nothing published. Releases are built by release.yml, which only runs by hand.
name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Test
        run: dotnet test Termilly.slnx -c Release
      - name: Build the setup program
        run: dotnet build installer/TermillySetup/TermillySetup.csproj -c Release

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Test
        run: dotnet test tests/Termilly.Core.Tests -c Release

  # The Linux build is also the macOS one: here it makes Termilly.app too, and the tests run the macOS parts (the
  # pseudo terminal, sockets, fonts, the launch agent that starts the host, the keychain).
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build src/Termilly.Linux -c Release
      - name: The app bundle is made
        run: |
          app=src/Termilly.Linux/bin/Release/net10.0/Termilly.app/Contents
          test -f "$app/Info.plist"
          test -L "$app/MacOS/termilly"
          test -x "$app/MacOS/termilly"
      # A keychain of the job's own, unlocked and the default, so the keychain test runs (and must: see KeychainTests).
      - name: A keychain for the tests
        run: |
          security create-keychain -p ci ci.keychain
          security set-keychain-settings ci.keychain
          security unlock-keychain -p ci ci.keychain
          security list-keychains -d user -s ci.keychain $(security list-keychains -d user | tr -d '"')
          security default-keychain -d user -s ci.keychain
      - name: Test
        env:
          TERMILLY_REQUIRE_KEYCHAIN: '1'
        run: dotnet test tests/Termilly.Core.Tests -c Release

  javascript:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
