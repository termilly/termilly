<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Termilly "T:" mark on the 32 px grid that make-icon.ps1 uses (its 32 px layout). The app and site use
       the PNG/ICO renders, which are tuned per size; this vector is for print and large uses. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d1833"/>
      <stop offset="1" stop-color="#07070a"/>
    </linearGradient>
    <linearGradient id="t" gradientUnits="userSpaceOnUse" x1="0" y1="8" x2="0" y2="25">
      <stop offset="0" stop-color="#eeeaff"/>
      <stop offset="1" stop-color="#c9c0ff"/>
    </linearGradient>
  </defs>
  <rect x="0.5" y="0.5" width="31" height="31" rx="6.5" fill="url(#tile)" stroke="#8b7bff" stroke-opacity="0.8"/>
  <g shape-rendering="crispEdges">
    <rect x="7" y="8" width="12" height="4" fill="url(#t)"/>
    <rect x="11" y="8" width="4" height="16" fill="url(#t)"/>
    <rect x="21" y="13" width="4" height="4" fill="#a395ff"/>
    <rect x="21" y="20" width="4" height="4" fill="#a395ff"/>
  </g>
</svg>
